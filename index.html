<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Donmaggi - 미래의 나에게 배송</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f6f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="돈막이">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #eeece4;
    display: flex;
    justify-content: center;
    padding: 32px 12px;
    color: #1a1a1a;
  }
  .phone {
    width: 100%;
    max-width: 380px;
    height: 720px;
    background: #fff;
    border-radius: 32px;
    padding: 10px;
    border: 1px solid #e2dfd4;
    box-shadow: 0 24px 48px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
  }
  .app { background: #f7f6f1; border-radius: 24px; height: 100%; overflow-y: auto; position: relative; }

  .topbar { padding: 16px 16px 0; }
  .toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand { font-size: 13px; font-weight: 700; color: #ff6b3d; letter-spacing: -0.3px; }
  .langs { display: flex; gap: 4px; }
  .lang-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid #ece9df; background: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lang-btn.active { border-color: #1a1a1a; box-shadow: 0 0 0 1px #1a1a1a inset; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; background: #fff; font-size: 12px; font-weight: 600; color: #999; border: 1px solid #ece9df; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* ---------- 목표 칩 리스트 ---------- */
  .goal-chips { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .goal-chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ece9df; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: #999; cursor: pointer; white-space: nowrap; }
  .chip.active { border-color: #ff6b3d; color: #ff6b3d; background: #fff6f2; }
  .chip .pct { font-weight: 700; }
  .chip-add { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #1a1a1a; color: #fff; font-size: 16px; cursor: pointer; }

  .goal-card { margin: 0 16px 18px; background: #fff; border-radius: 18px; padding: 16px; border: 1px solid #ece9df; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .goal-name { font-size: 14px; font-weight: 700; }
  .goal-pct { font-size: 13px; font-weight: 700; color: #ff6b3d; }
  .goal-amt { font-size: 12px; color: #999; margin-bottom: 14px; }
  .gauge { position: relative; height: 34px; margin-bottom: 6px; }
  .gauge-track { position: absolute; top: 15px; left: 6px; right: 6px; height: 4px; background: #ece9df; border-radius: 2px; }
  .gauge-fill { position: absolute; top: 15px; left: 6px; height: 4px; background: linear-gradient(90deg,#ffb199,#ff6b3d); border-radius: 2px; transition: width .6s ease; }
  .gauge-plane { position: absolute; top: 2px; font-size: 20px; transform: translateX(-50%); transition: left .6s ease; }
  .gauge-steps { display: flex; justify-content: space-between; font-size: 10px; color: #b5b2a8; }
  .gauge-steps span.done { color: #ff6b3d; font-weight: 700; }

  .section-title { padding: 0 16px; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .section-sub { padding: 0 16px; font-size: 12px; color: #999; margin-bottom: 12px; }
  .zone { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .card-lg { display: flex; background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #ece9df; align-items: center; gap: 12px; cursor: pointer; }
  .card-lg .emoji { font-size: 30px; }
  .card-lg .info { flex: 1; }
  .card-lg .title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .card-lg .desc { font-size: 11px; color: #999; }
  .card-lg .price { font-size: 13px; font-weight: 700; color: #ff6b3d; }
  .row-2 { display: flex; gap: 10px; }
  .card-sm { flex: 1; background: #fff; border-radius: 16px; padding: 12px; border: 1px solid #ece9df; text-align: center; cursor: pointer; }
  .card-sm .emoji { font-size: 26px; margin-bottom: 6px; }
  .card-sm .label { font-size: 10px; color: #b5b2a8; margin-bottom: 2px; }
  .card-sm .title { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .card-sm .price { font-size: 12px; font-weight: 700; color: #ff6b3d; }

  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s ease; border-radius: 24px; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 22px 20px 24px; transform: translateY(100%); transition: transform .3s ease; max-height: 90%; overflow-y: auto; }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: #e5e3da; border-radius: 2px; margin: 0 auto 16px; }

  h3.sheet-title { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  p.sheet-desc { margin: 0 0 18px; font-size: 13px; color: #666; line-height: 1.5; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f1efe8; cursor: pointer; font-size: 14px; }
  .list-item:last-child { border-bottom: none; }
  .list-item .p { color: #999; font-size: 13px; }

  button.primary, button.ghost { width: 100%; height: 50px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; margin-top: 6px; }
  button.primary { background: #1a1a1a; color: #fff; }
  button.ghost { background: transparent; color: #999; }

  .confirm-box { background: #fff7f3; border: 1px solid #ffd9c7; border-radius: 14px; padding: 14px; margin-bottom: 18px; font-size: 13px; color: #b0491f; line-height: 1.5; }

  .pay-amt { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 18px; }
  .card-option { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #ece9df; border-radius: 12px; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
  .card-option.selected { border-color: #1a1a1a; background: #faf9f6; }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; }
  .card-option.selected .radio { border-color: #1a1a1a; background: radial-gradient(#1a1a1a 40%, transparent 44%); }

  .auth-wrap { text-align: center; padding: 10px 0 6px; }
  .fingerprint { width: 70px; height: 70px; border-radius: 50%; background: #f1efe8; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
  .fingerprint.scanning { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(26,26,26,0.15);} 50%{ box-shadow:0 0 0 12px rgba(26,26,26,0);} }

  .receipt-screen { position: absolute; inset: 0; background: #fff; border-radius: 24px; padding: 32px 22px 24px; display: none; flex-direction: column; align-items: center; text-align: center; opacity: 0; transition: opacity .3s ease; }
  .receipt-screen.open { display: flex; opacity: 1; }
  .rocket { font-size: 44px; margin-bottom: 14px; }
  .receipt-screen h2 { margin: 0 0 4px; font-size: 18px; }
  .receipt-screen .sub { font-size: 13px; color: #999; margin-bottom: 20px; }
  .receipt-card { width: 100%; border: 1px dashed #ddd8c9; border-radius: 14px; padding: 18px; text-align: left; font-size: 13px; line-height: 2; background: #fffdf8; }
  .receipt-card .tag { display: inline-block; background: #1a1a1a; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
  .r-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #eee; padding: 2px 0; }
  .r-row .k { color: #999; }
  .r-row .v { font-weight: 700; }
  .receipt-screen button.primary { margin-top: 20px; }

  /* ---------- 새 목표 만들기 ---------- */
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .emoji-opt { width: 42px; height: 42px; border-radius: 12px; background: #f7f6f1; border: 2px solid transparent; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .emoji-opt.selected { border-color: #1a1a1a; background: #fff; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #999; margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid #ece9df; padding: 0 12px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #1a1a1a; }

  /* ---------- 앱(설치) 모드 / 모바일: 목업 프레임 제거하고 전체화면 ---------- */
  @media (display-mode: standalone), (display-mode: fullscreen), (max-width: 480px) {
    html, body { height: 100%; overscroll-behavior: none; }
    body { padding: 0; background: #f7f6f1; }
    .phone {
      max-width: none; width: 100%; height: 100dvh;
      border: none; border-radius: 0; box-shadow: none;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background: #f7f6f1;
    }
    .app { border-radius: 0; }
    .overlay, .receipt-screen { border-radius: 0; }
    .sheet { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="phone"><div class="app" id="app">

  <div class="topbar">
    <div class="toprow">
      <div class="brand" id="brandText">Donmaggi</div>
      <div class="langs">
        <div class="lang-btn" id="settingsBtn" onclick="openSettings()">⚙️</div>
        <div class="lang-btn active" id="lang-ko" onclick="setLanguage('ko')">🇰🇷</div>
        <div class="lang-btn" id="lang-en" onclick="setLanguage('en')">🇺🇸</div>
        <div class="lang-btn" id="lang-ja" onclick="setLanguage('ja')">🇯🇵</div>
        <div class="lang-btn" id="lang-zh" onclick="setLanguage('zh')">🇨🇳</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab" id="tab-food" onclick="switchTab('food')"></div>
      <div class="tab" id="tab-fashion" onclick="switchTab('fashion')"></div>
      <div class="tab" id="tab-beauty" onclick="switchTab('beauty')"></div>
    </div>
  </div>

  <div class="goal-chips" id="goalChips"></div>

  <div class="goal-card">
    <div class="goal-top">
      <span class="goal-name" id="goalNameText"></span>
      <span class="goal-pct" id="goalPct">70%</span>
    </div>
    <div class="goal-amt" id="goalAmt"></div>
    <div class="gauge">
      <div class="gauge-track"></div>
      <div class="gauge-fill" id="gaugeFill" style="width:70%"></div>
      <div class="gauge-plane" id="gaugePlane" style="left:70%">✈️</div>
    </div>
    <div class="gauge-steps">
      <span class="done" id="stepPaid"></span>
      <span class="done" id="stepPrep"></span>
      <span id="stepShip"></span>
      <span id="stepDone"></span>
    </div>
  </div>

  <div class="section-title" id="sectionTitleText"></div>
  <div class="section-sub" id="sectionSubText"></div>
  <div class="zone" id="zone"></div>

  <!-- 카카오페이 링크 설정 -->
  <div class="overlay" id="ovSettings">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="settingsTitleText"></h3>
      <p class="sheet-desc" id="settingsDescText"></p>
      <div class="field">
        <label id="settingsInputLabelText"></label>
        <input type="url" id="myKakaoLinkInput" placeholder="https://link.kakaopay.com/...">
      </div>
      <div class="field">
        <label id="settingsBankLabelText"></label>
        <input type="text" id="myBankInput" maxlength="20">
      </div>
      <div class="field">
        <label id="settingsAccountLabelText"></label>
        <input type="text" id="myAccountInput" maxlength="30" inputmode="numeric">
      </div>
      <div class="field">
        <label>상품 목록 주소 (Catalog URL)</label>
        <input type="url" id="catalogUrlInput" placeholder="products.json 또는 https://...">
        <div style="font-size:11px;color:#bbb;margin-top:5px" id="catalogStatus"></div>
      </div>
      <button class="primary" id="settingsSaveBtn" onclick="saveSettings()"></button>
      <button class="ghost" id="settingsCancelBtn" onclick="closeOverlay('ovSettings')"></button>
      <button class="ghost" onclick="resetState()" style="height:36px;font-size:12px;color:#c0392b">↺ Reset</button>
    </div>
  </div>

  <!-- 새 목표 만들기 -->
  <div class="overlay" id="ovNewGoal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="newGoalTitleText"></h3>
      <p class="sheet-desc" id="chooseIconText"></p>
      <div class="emoji-grid" id="emojiGrid"></div>
      <div class="field">
        <label id="goalNameLabelText"></label>
        <input type="text" id="newGoalName" maxlength="20">
      </div>
      <div class="field">
        <label id="goalAmountLabelText"></label>
        <input type="number" id="newGoalAmount" min="1000" step="1000">
      </div>
      <button class="primary" id="goalSaveBtn" onclick="saveNewGoal()"></button>
      <button class="ghost" id="goalCancelBtn" onclick="closeOverlay('ovNewGoal')"></button>
    </div>
  </div>

  <div class="overlay" id="ovGroup">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="groupTitle"></h3>
      <div id="groupList"></div>
      <button class="ghost" id="groupCloseBtn" onclick="closeOverlay('ovGroup')"></button>
    </div>
  </div>

  <div class="overlay" id="ovConfirm">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="cfTitle"></h3>
      <div class="confirm-box" id="cfBox"></div>
      <button class="primary" id="confirmBuyBtn" onclick="openPayment()"></button>
      <button class="ghost" id="confirmCancelBtn" onclick="closeOverlay('ovConfirm')"></button>
    </div>
  </div>

  <div class="overlay" id="ovPay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="payTitleText"></h3>
      <div class="pay-amt" id="payAmt">30,000</div>
      <div class="card-option selected" data-method="card" onclick="selectCard(this)"><div class="radio"></div><span id="payLumpLabel"></span></div>
      <div class="card-option" data-method="card" onclick="selectCard(this)"><div class="radio"></div><span id="payShinhanLabel"></span></div>
      <div class="card-option" data-method="card" onclick="selectCard(this)"><div class="radio"></div><span id="payKakaobankLabel"></span></div>
      <div class="card-option" data-method="kakaopay" onclick="selectCard(this)"><div class="radio"></div><span id="payKakaopayLabel"></span></div>
      <div class="card-option" data-method="myaccount" onclick="selectCard(this)"><div class="radio"></div><span id="payMyAccountLabel"></span></div>
      <button class="primary" id="payButtonText" onclick="handlePayClick()"></button>
    </div>
  </div>

  <div class="overlay" id="ovAuth">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="auth-wrap">
        <h3 class="sheet-title" id="authTitleText"></h3>
        <p class="sheet-desc" id="authDescText"></p>
        <div class="fingerprint" id="fingerBtn" onclick="runAuth()">👆</div>
        <p class="sheet-desc" id="authStatus" style="margin-bottom:0"></p>
      </div>
    </div>
  </div>

  <div class="overlay" id="ovKakao">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="auth-wrap">
        <h3 class="sheet-title" id="kakaoTitleText"></h3>
        <p class="sheet-desc" id="kakaoDescText"></p>
        <div class="fingerprint" style="background:#fee500;" onclick="openKakaoLink()">💬</div>
        <p class="sheet-desc" id="kakaoHintText" style="margin-bottom:18px"></p>
        <button class="primary" id="kakaoDoneBtn" onclick="confirmKakaoSent()"></button>
        <button class="ghost" id="kakaoCancelBtn" onclick="closeOverlay('ovKakao')"></button>
      </div>
    </div>
  </div>

  <!-- 내 계좌로 이체 -->
  <div class="overlay" id="ovMyAccount">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="auth-wrap">
        <h3 class="sheet-title" id="myAccTitleText"></h3>
        <p class="sheet-desc" id="myAccDescText"></p>
        <div class="confirm-box" style="text-align:center;color:#1a1a1a;background:#f7f6f1;border-color:#ece9df">
          <div style="font-size:12px;color:#999" id="myAccBankShow"></div>
          <div style="font-size:18px;font-weight:800;letter-spacing:.5px" id="myAccNumShow"></div>
          <div style="font-size:15px;font-weight:700;color:#ff6b3d;margin-top:4px" id="myAccAmtShow"></div>
        </div>
        <button class="ghost" id="myAccCopyBtn" onclick="copyMyAccount()" style="height:40px;margin-top:0"></button>
        <button class="primary" id="myAccDoneBtn" onclick="confirmMyAccountSent()"></button>
        <button class="ghost" id="myAccCancelBtn" onclick="closeOverlay('ovMyAccount')"></button>
      </div>
    </div>
  </div>

  <div class="receipt-screen" id="ovReceipt">
    <div class="rocket">🚀</div>
    <h2 id="receiptTitleText"></h2>
    <div class="sub" id="receiptSubText"></div>
    <div class="receipt-card">
      <span class="tag" id="receiptTagText"></span>
      <div class="r-row"><span class="k" id="receiptProductLabel"></span><span class="v" id="rcName"></span></div>
      <div class="r-row"><span class="k" id="receiptPriceLabel"></span><span class="v" id="rcPrice"></span></div>
      <div class="r-row"><span class="k" id="receiptAddrLabel"></span><span class="v" id="receiptAddrValue"></span></div>
      <div class="r-row"><span class="k" id="rcStatLabel"></span><span class="v" id="rcStat"></span></div>
      <div class="r-row"><span class="k" id="receiptContributionLabel"></span><span class="v" id="rcGoalPct"></span></div>
    </div>
    <button class="primary" id="receiptBackBtn" onclick="finishReceipt()"></button>
  </div>

</div></div>

<script>
  const DEFAULT_GOALS = [ { id: 'default', emoji: '✈️', name: null, target: 350000, saved: 245000 } ];

  // ---------- 저장/불러오기 ----------
  function loadState() {
    try {
      const raw = localStorage.getItem('donmaggi_goals');
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_GOALS));
  }
  function saveState() {
    try {
      localStorage.setItem('donmaggi_goals', JSON.stringify(goals));
      localStorage.setItem('donmaggi_activeGoal', activeGoalId);
      localStorage.setItem('donmaggi_lang', currentLang);
    } catch (e) {}
  }
  function resetState() {
    if (!confirm('저장된 목표를 모두 지우고 처음 상태로 되돌릴까요?')) return;
    localStorage.removeItem('donmaggi_goals');
    localStorage.removeItem('donmaggi_activeGoal');
    localStorage.removeItem('donmaggi_catalog_cache');
    location.reload();
  }

  let goals = loadState();
  let activeGoalId = (goals.find(g => g.id === localStorage.getItem('donmaggi_activeGoal')) || goals[0]).id;
  let current = null;
  let activeTab = 'food';
  let currentLang = localStorage.getItem('donmaggi_lang') || 'ko';
  let selectedMethod = 'card';
  let selectedNewEmoji = '⭐';
  let KAKAO_LINK = localStorage.getItem('myKakaoLink') || '';
  let MY_BANK = localStorage.getItem('myBank') || '';
  let MY_ACCOUNT = localStorage.getItem('myAccount') || '';
  const EMOJI_CHOICES = ['⭐','💻','📱','🎧','👜','🚗','🎮','📷','🏠','👟','⌚','🎸'];

  function fmt(n) { return n.toLocaleString('en-US'); }
  function activeGoal() { return goals.find(g => g.id === activeGoalId); }
  function goalDisplayName(g) { return g.id === 'default' ? T[currentLang].goalName : `${g.emoji} ${g.name}`; }

  const T = {
    ko: { brand:'Donmaggi 돈막이', tabFood:'🍚 배달음식', tabFashion:'👕 패션', tabBeauty:'💄 뷰티',
      goalName:'✈️ 제주도 왕복 항공권', sectionTitle:'🔥 충동구매 존', sectionSub:'오늘의 위기 상황을 골라보세요',
      stepPaid:'결제완료', stepPrep:'상품준비', stepShip:'배송중', stepDone:'배송완료',

  // ---------- 상품 카탈로그: 원격에서 불러오기 ----------
  // CATALOG_URL을 서버/API 엔드포인트로 바꾸면 앱을 다시 배포하지 않아도 상품·가격이 갱신됩니다.
  // 설정(⚙️) 화면에서 URL을 직접 넣을 수도 있습니다. 비워두면 같은 폴더의 products.json을 씁니다.
  let CATS = FALLBACK_CATS;
  let CATALOG_URL = localStorage.getItem('donmaggi_catalog_url') || 'products.json';

  function isValidCatalog(j) {
    return j && j.ko && j.ko.food && Array.isArray(j.ko.food.smalls);
  }

  function applyCatalog(j, source) {
    CATS = j;
    // 현재 언어에 없는 카탈로그면 ko로 폴백
    if (!CATS[currentLang]) CATS[currentLang] = CATS.ko;
    renderZone(activeTab);
    const el = document.getElementById('catalogStatus');
    if (el) el.textContent = source;
  }

  async function refreshCatalog() {
    // 1순위: 직전에 성공한 캐시를 즉시 적용 (오프라인에서도 최신 상태 유지)
    try {
      const cached = localStorage.getItem('donmaggi_catalog_cache');
      if (cached) {
        const j = JSON.parse(cached);
        if (isValidCatalog(j)) applyCatalog(j, '저장된 목록');
      }
    } catch (e) {}

    // 2순위: 네트워크에서 최신본 가져오기
    try {
      const res = await fetch(CATALOG_URL + (CATALOG_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      if (!isValidCatalog(j)) throw new Error('형식 오류');
      localStorage.setItem('donmaggi_catalog_cache', JSON.stringify(j));
      localStorage.setItem('donmaggi_catalog_at', new Date().toISOString());
      applyCatalog(j, '갱신됨 ' + new Date().toLocaleTimeString('ko-KR'));
    } catch (e) {
      const el = document.getElementById('catalogStatus');
      if (el) el.textContent = '갱신 실패 (저장된 목록 사용)';
    }
  }


  function priceLabel(price) { return fmt(price) + T[currentLang].currency; }

  // ---------- 목표 칩 & 목표 카드 ----------
  function renderGoalChips() {
    let html = '';
    goals.forEach(g => {
      const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
      const name = g.id === 'default' ? T[currentLang].goalName.replace(/^\S+\s/, '') : g.name;
      html += `<div class="chip ${g.id === activeGoalId ? 'active' : ''}" onclick="setActiveGoal('${g.id}')">${g.emoji} ${name} <span class="pct">${pct}%</span></div>`;
    });
    html += `<div class="chip-add" onclick="openNewGoal()">+</div>`;
    document.getElementById('goalChips').innerHTML = html;
  }

  function setActiveGoal(id) {
    activeGoalId = id;
    saveState();
    renderGoalChips();
    renderGoal();
  }

  function renderGoal() {
    const t = T[currentLang];
    const g = activeGoal();
    const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
    document.getElementById('goalNameText').textContent = goalDisplayName(g);
    document.getElementById('goalPct').textContent = pct + '%';
    document.getElementById('goalAmt').textContent = `${fmt(g.saved)}${t.currency} / ${fmt(g.target)}${t.currency} ${t.savedSuffix}`;
    document.getElementById('gaugeFill').style.width = pct + '%';
    document.getElementById('gaugePlane').style.left = pct + '%';
    document.getElementById('stepPaid').textContent = t.stepPaid;
    document.getElementById('stepPrep').textContent = t.stepPrep;
    document.getElementById('stepShip').textContent = t.stepShip;
    document.getElementById('stepDone').textContent = t.stepDone;
    document.getElementById('stepShip').classList.toggle('done', pct >= 90);
    document.getElementById('stepDone').classList.toggle('done', pct >= 100);
  }

  // ---------- 새 목표 만들기 ----------
  function openNewGoal() {
    selectedNewEmoji = EMOJI_CHOICES[0];
    document.getElementById('newGoalName').value = '';
    document.getElementById('newGoalAmount').value = '';
    document.getElementById('newGoalName').placeholder = T[currentLang].goalNamePlaceholder;
    document.getElementById('newGoalAmount').placeholder = T[currentLang].goalAmountPlaceholder;
    renderEmojiGrid();
    openOverlay('ovNewGoal');
  }

  function renderEmojiGrid() {
    let html = '';
    EMOJI_CHOICES.forEach(e => {
      html += `<div class="emoji-opt ${e === selectedNewEmoji ? 'selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>`;
    });
    document.getElementById('emojiGrid').innerHTML = html;
  }

  function selectEmoji(e) {
    selectedNewEmoji = e;
    renderEmojiGrid();
  }

  function saveNewGoal() {
    const name = document.getElementById('newGoalName').value.trim();
    const amount = parseInt(document.getElementById('newGoalAmount').value, 10);
    if (!name || !amount || amount <= 0) return;
    const id = 'g' + Date.now();
    goals.push({ id, emoji: selectedNewEmoji, name, target: amount, saved: 0 });
    activeGoalId = id;
    saveState();
    closeOverlay('ovNewGoal');
    renderGoalChips();
    renderGoal();
  }

    document.getElementById('myAccCancelBtn').textContent = t.myAccCancel;
  }

  function setLanguage(lang) {
    currentLang = lang;
    ['ko','en','ja','zh'].forEach(l => document.getElementById('lang-' + l).classList.toggle('active', l === lang));
    applyStaticText();
    renderGoalChips();
    renderGoal();
    renderZone(activeTab);
    saveState();
  }

  function switchTab(key) {
    activeTab = key;
    ['food','fashion','beauty'].forEach(k => document.getElementById('tab-' + k).classList.toggle('active', k === key));
    renderZone(key);
  }

  function renderZone(key) {
    const cat = CATS[currentLang][key];
    const g = cat.group;
    let html = `
      <div class="card-lg" onclick="openGroupPicker('${key}')">
        <div class="emoji">${g.emoji}</div>
        <div class="info"><div class="title">${g.title}</div><div class="desc">${g.desc}</div></div>
        <div class="price">~${priceLabel(g.maxPrice)}</div>
      </div>
      <div class="row-2">`;
    cat.smalls.forEach((s, idx) => {
      html += `
        <div class="card-sm" onclick="openConfirmFromSmall('${key}', ${idx})">
          <div class="emoji">${s.emoji}</div>
          <div class="label">${s.label}</div>
          <div class="title">${s.name}</div>
          <div class="price">${priceLabel(s.price)}</div>
        </div>`;
    });
    html += `</div>`;
    document.getElementById('zone').innerHTML = html;
  }

  function openOverlay(id) { document.getElementById(id).classList.add('open'); }
  function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }

  function openGroupPicker(key) {
    const g = CATS[currentLang][key].group;
    document.getElementById('groupTitle').textContent = g.emoji + ' ' + g.pickTitle;
    let html = '';
    g.items.forEach((item, idx) => {
      html += `<div class="list-item" onclick="pickGroupItem('${key}', ${idx})">
        <span>${item.emoji} ${item.name}</span><span class="p">${priceLabel(item.price)}</span>
      </div>`;
    });
    document.getElementById('groupList').innerHTML = html;
    openOverlay('ovGroup');
  }

  function pickGroupItem(key, idx) {
    closeOverlay('ovGroup');
    openConfirm(CATS[currentLang][key].group.items[idx]);
  }

  function openConfirmFromSmall(key, idx) {
    openConfirm(CATS[currentLang][key].smalls[idx]);
  }

  function openConfirm(item) {
    current = item;
    const t = T[currentLang];
    document.getElementById('cfTitle').textContent = item.emoji + ' ' + item.name;
    document.getElementById('cfBox').innerHTML = t.confirmTemplate(item.name, priceLabel(item.price));
    openOverlay('ovConfirm');
  }

  function openPayment() {
    closeOverlay('ovConfirm');
    document.getElementById('payAmt').textContent = priceLabel(current.price);
    openOverlay('ovPay');
  }

  function selectCard(el) {
    document.querySelectorAll('.card-option').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedMethod = el.dataset.method;
  }

  function handlePayClick() {
    closeOverlay('ovPay');
    if (selectedMethod === 'kakaopay') {
      if (!KAKAO_LINK) {
        openSettings();
        return;
      }
      openOverlay('ovKakao');
    } else if (selectedMethod === 'myaccount') {
      if (!MY_BANK || !MY_ACCOUNT) {
        openSettings();
        return;
      }
      openMyAccountSheet();
    } else {
      document.getElementById('authStatus').textContent = T[currentLang].authTouch;
      document.getElementById('fingerBtn').classList.remove('scanning');
      openOverlay('ovAuth');
    }
  }

  function runAuth() {
    const btn = document.getElementById('fingerBtn');
    btn.classList.add('scanning');
    document.getElementById('authStatus').textContent = T[currentLang].authScanning;
    setTimeout(() => { closeOverlay('ovAuth'); showReceipt(); }, 900);
  }

  function openKakaoLink() {
    if (!KAKAO_LINK) {
      closeOverlay('ovKakao');
      openSettings();
      return;
    }
    window.open(KAKAO_LINK, '_blank');
  }
  function confirmKakaoSent() { closeOverlay('ovKakao'); showReceipt(); }

  function openSettings() {
    document.getElementById('myKakaoLinkInput').value = KAKAO_LINK;
    document.getElementById('myBankInput').value = MY_BANK;
    document.getElementById('myAccountInput').value = MY_ACCOUNT;
    document.getElementById('myBankInput').placeholder = T[currentLang].settingsBankPlaceholder;
    document.getElementById('myAccountInput').placeholder = T[currentLang].settingsAccountPlaceholder;
    document.getElementById('catalogUrlInput').value = CATALOG_URL;
    const at = localStorage.getItem('donmaggi_catalog_at');
    document.getElementById('catalogStatus').textContent = at ? '마지막 갱신 ' + new Date(at).toLocaleString('ko-KR') : '아직 갱신 안 됨';
    openOverlay('ovSettings');
  }

  function saveSettings() {
    KAKAO_LINK = document.getElementById('myKakaoLinkInput').value.trim();
    MY_BANK = document.getElementById('myBankInput').value.trim();
    MY_ACCOUNT = document.getElementById('myAccountInput').value.trim();
    localStorage.setItem('myKakaoLink', KAKAO_LINK);
    localStorage.setItem('myBank', MY_BANK);
    localStorage.setItem('myAccount', MY_ACCOUNT);
    const newUrl = document.getElementById('catalogUrlInput').value.trim() || 'products.json';
    if (newUrl !== CATALOG_URL) {
      CATALOG_URL = newUrl;
      localStorage.setItem('donmaggi_catalog_url', CATALOG_URL);
      localStorage.removeItem('donmaggi_catalog_cache');
      refreshCatalog();
    }
    closeOverlay('ovSettings');
  }

  function openMyAccountSheet() {
    const t = T[currentLang];
    document.getElementById('myAccBankShow').textContent = MY_BANK;
    document.getElementById('myAccNumShow').textContent = MY_ACCOUNT;
    document.getElementById('myAccAmtShow').textContent = priceLabel(current.price);
    document.getElementById('myAccCopyBtn').textContent = t.myAccCopy;
    openOverlay('ovMyAccount');
  }

  function copyMyAccount() {
    navigator.clipboard.writeText(MY_ACCOUNT).then(() => {
      document.getElementById('myAccCopyBtn').textContent = T[currentLang].myAccCopied;
      setTimeout(() => {
        document.getElementById('myAccCopyBtn').textContent = T[currentLang].myAccCopy;
      }, 1500);
    });
  }

  function confirmMyAccountSent() { closeOverlay('ovMyAccount'); showReceipt(); }

  function showReceipt() {
    const g = activeGoal();
    g.saved = Math.min(g.target, g.saved + current.price);
    saveState();
    document.getElementById('rcName').textContent = current.name;
    document.getElementById('rcPrice').textContent = priceLabel(current.price);
    document.getElementById('rcStatLabel').textContent = current.statLabel;
    document.getElementById('rcStat').textContent = current.statValue;
    const pct = Math.round((current.price / g.target) * 1000) / 10;
    document.getElementById('rcGoalPct').textContent = '+' + pct + '%';
    document.getElementById('ovReceipt').classList.add('open');
  }

  function finishReceipt() {
    document.getElementById('ovReceipt').classList.remove('open');
    renderGoalChips();
    renderGoal();
  }

  setLanguage(currentLang);
  switchTab('food');
  refreshCatalog();
  // 앱을 다시 열 때마다 최신 목록 확인
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCatalog(); });

  // ---------- 서비스 워커 등록 (오프라인 실행) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
