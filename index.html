<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Donmaggi - 미래의 나에게 배송</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f6f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="돈막이">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #eeece4;
    display: flex;
    justify-content: center;
    padding: 32px 12px;
    color: #1a1a1a;
  }
  .phone {
    width: 100%;
    max-width: 380px;
    height: 720px;
    background: #fff;
    border-radius: 32px;
    padding: 10px;
    border: 1px solid #e2dfd4;
    box-shadow: 0 24px 48px rgba(0,0,0,0.1);
    position: relative;
    overflow: hidden;
  }
  .app { background: #f7f6f1; border-radius: 24px; height: 100%; overflow-y: auto; position: relative; }

  .topbar { padding: 16px 16px 0; }
  .toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .brand { font-size: 13px; font-weight: 700; color: #ff6b3d; letter-spacing: -0.3px; }
  .langs { display: flex; gap: 4px; }
  .lang-btn { width: 26px; height: 26px; border-radius: 8px; border: 1px solid #ece9df; background: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .lang-btn.active { border-color: #1a1a1a; box-shadow: 0 0 0 1px #1a1a1a inset; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; background: #fff; font-size: 12px; font-weight: 600; color: #999; border: 1px solid #ece9df; cursor: pointer; transition: background .15s ease, color .15s ease; }
  .tab.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* ---------- 목표 칩 리스트 ---------- */
  .goal-chips { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
  .goal-chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ece9df; border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 600; color: #999; cursor: pointer; white-space: nowrap; }
  .chip.active { border-color: #ff6b3d; color: #ff6b3d; background: #fff6f2; }
  .chip .pct { font-weight: 700; }
  .chip-add { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: #1a1a1a; color: #fff; font-size: 16px; cursor: pointer; }

  .goal-card { margin: 0 16px 18px; background: #fff; border-radius: 18px; padding: 16px; border: 1px solid #ece9df; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .goal-name { font-size: 14px; font-weight: 700; }
  .goal-pct { font-size: 13px; font-weight: 700; color: #ff6b3d; }
  .goal-amt { font-size: 12px; color: #999; margin-bottom: 14px; }
  .gauge { position: relative; height: 34px; margin-bottom: 6px; }
  .gauge-track { position: absolute; top: 15px; left: 6px; right: 6px; height: 4px; background: #ece9df; border-radius: 2px; }
  .gauge-fill { position: absolute; top: 15px; left: 6px; height: 4px; background: linear-gradient(90deg,#ffb199,#ff6b3d); border-radius: 2px; transition: width .6s ease; }
  .gauge-plane { position: absolute; top: 2px; font-size: 20px; transform: translateX(-50%); transition: left .6s ease; }
  .gauge-steps { display: flex; justify-content: space-between; font-size: 10px; color: #b5b2a8; }
  .gauge-steps span.done { color: #ff6b3d; font-weight: 700; }

  .section-title { padding: 0 16px; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .section-sub { padding: 0 16px; font-size: 12px; color: #999; margin-bottom: 12px; }
  .zone { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .card-lg { display: flex; background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #ece9df; align-items: center; gap: 12px; cursor: pointer; }
  .card-lg .emoji { font-size: 30px; }
  .card-lg .info { flex: 1; }
  .card-lg .title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .card-lg .desc { font-size: 11px; color: #999; }
  .card-lg .price { font-size: 13px; font-weight: 700; color: #ff6b3d; }
  .row-2 { display: flex; gap: 10px; }
  .card-sm { flex: 1; background: #fff; border-radius: 16px; padding: 12px; border: 1px solid #ece9df; text-align: center; cursor: pointer; }
  .card-sm .emoji { font-size: 26px; margin-bottom: 6px; }
  .card-sm .label { font-size: 10px; color: #b5b2a8; margin-bottom: 2px; }
  .card-sm .title { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .card-sm .price { font-size: 12px; font-weight: 700; color: #ff6b3d; }

  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s ease; border-radius: 24px; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 22px 20px 24px; transform: translateY(100%); transition: transform .3s ease; max-height: 90%; overflow-y: auto; }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: #e5e3da; border-radius: 2px; margin: 0 auto 16px; }

  h3.sheet-title { margin: 0 0 8px; font-size: 17px; font-weight: 700; }
  p.sheet-desc { margin: 0 0 18px; font-size: 13px; color: #666; line-height: 1.5; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f1efe8; cursor: pointer; font-size: 14px; }
  .list-item:last-child { border-bottom: none; }
  .list-item .p { color: #999; font-size: 13px; }

  button.primary, button.ghost { width: 100%; height: 50px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; margin-top: 6px; }
  button.primary { background: #1a1a1a; color: #fff; }
  button.ghost { background: transparent; color: #999; }

  .confirm-box { background: #fff7f3; border: 1px solid #ffd9c7; border-radius: 14px; padding: 14px; margin-bottom: 18px; font-size: 13px; color: #b0491f; line-height: 1.5; }

  .pay-amt { text-align: center; font-size: 26px; font-weight: 800; margin-bottom: 18px; }
  .card-option { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #ece9df; border-radius: 12px; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
  .card-option.selected { border-color: #1a1a1a; background: #faf9f6; }
  .radio { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; }
  .card-option.selected .radio { border-color: #1a1a1a; background: radial-gradient(#1a1a1a 40%, transparent 44%); }

  .auth-wrap { text-align: center; padding: 10px 0 6px; }
  .fingerprint { width: 70px; height: 70px; border-radius: 50%; background: #f1efe8; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
  .fingerprint.scanning { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(26,26,26,0.15);} 50%{ box-shadow:0 0 0 12px rgba(26,26,26,0);} }

  .receipt-screen { position: absolute; inset: 0; background: #fff; border-radius: 24px; padding: 32px 22px 24px; display: none; flex-direction: column; align-items: center; text-align: center; opacity: 0; transition: opacity .3s ease; }
  .receipt-screen.open { display: flex; opacity: 1; }
  .rocket { font-size: 44px; margin-bottom: 14px; }
  .receipt-screen h2 { margin: 0 0 4px; font-size: 18px; }
  .receipt-screen .sub { font-size: 13px; color: #999; margin-bottom: 20px; }
  .receipt-card { width: 100%; border: 1px dashed #ddd8c9; border-radius: 14px; padding: 18px; text-align: left; font-size: 13px; line-height: 2; background: #fffdf8; }
  .receipt-card .tag { display: inline-block; background: #1a1a1a; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
  .r-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #eee; padding: 2px 0; }
  .r-row .k { color: #999; }
  .r-row .v { font-weight: 700; }
  .receipt-screen button.primary { margin-top: 20px; }

  /* ---------- 새 목표 만들기 ---------- */
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .emoji-opt { width: 42px; height: 42px; border-radius: 12px; background: #f7f6f1; border: 2px solid transparent; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .emoji-opt.selected { border-color: #1a1a1a; background: #fff; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #999; margin-bottom: 6px; font-weight: 600; }
  .field input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid #ece9df; padding: 0 12px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #1a1a1a; }

  /* ---------- 넛지 배너 (취약 시간대 / 재참여) ---------- */
  .nudge { margin: 0 16px 12px; background: #fff7f3; border: 1px solid #ffd9c7; border-radius: 14px; padding: 12px 14px; display: none; align-items: center; gap: 10px; }
  .nudge.show { display: flex; }
  .nudge .n-emoji { font-size: 20px; flex-shrink: 0; }
  .nudge .n-body { flex: 1; font-size: 12px; color: #b0491f; line-height: 1.45; }
  .nudge .n-cta { flex-shrink: 0; background: #ff6b3d; color: #fff; border: none; border-radius: 999px; padding: 7px 12px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .nudge .n-close { flex-shrink: 0; color: #d9a892; font-size: 15px; cursor: pointer; padding: 0 2px; }

  /* ---------- 스트릭 / 도구 줄 ---------- */
  .tool-row { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 12px; }
  .tool-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; background: #fff; border: 1px solid #ece9df; border-radius: 12px; padding: 9px 6px; font-size: 11px; font-weight: 700; color: #666; cursor: pointer; font-family: inherit; }
  .tool-btn .t-num { color: #ff6b3d; }
  .tool-btn.hot { border-color: #ffd9c7; background: #fff7f3; color: #b0491f; }

  /* ---------- 퀵로그 ---------- */
  .quick-amt-wrap { position: relative; margin-bottom: 14px; }
  .quick-amt-wrap input { width: 100%; height: 64px; border-radius: 14px; border: 1px solid #ece9df; padding: 0 44px 0 16px; font-size: 24px; font-weight: 800; font-family: inherit; text-align: right; }
  .quick-amt-wrap input:focus { outline: none; border-color: #1a1a1a; }
  .quick-amt-wrap .unit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #999; font-weight: 700; pointer-events: none; }
  .amt-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .amt-chip { flex: 1 0 auto; background: #f7f6f1; border: 1px solid #ece9df; border-radius: 999px; padding: 8px 10px; font-size: 12px; font-weight: 700; color: #666; cursor: pointer; font-family: inherit; }
  .amt-chip:active { background: #fff; border-color: #1a1a1a; }
  .src-note { font-size: 11px; color: #b5b2a8; margin: -8px 0 14px; }

  /* ---------- 인사이트 (패턴 대시보드) ---------- */
  .stat-grid { display: flex; gap: 8px; margin-bottom: 20px; }
  .stat-box { flex: 1; background: #f7f6f1; border-radius: 12px; padding: 11px 8px; text-align: center; }
  .stat-box .s-val { font-size: 15px; font-weight: 800; color: #1a1a1a; }
  .stat-box .s-key { font-size: 10px; color: #999; margin-top: 3px; }
  .chart-title { font-size: 12px; font-weight: 700; color: #666; margin: 0 0 10px; }
  .chart { margin-bottom: 20px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .bar-label { width: 48px; flex-shrink: 0; font-size: 11px; color: #999; text-align: right; }
  .bar-track { flex: 1; height: 16px; background: #f4f2eb; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#ffb199,#ff6b3d); border-radius: 5px; transition: width .4s ease; }
  .bar-fill.dim { background: #ddd8c9; }
  .bar-val { width: 26px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: #666; }
  .empty-note { font-size: 13px; color: #999; line-height: 1.6; text-align: center; padding: 26px 8px; }
  .hint-box { background: #f7f6f1; border-radius: 12px; padding: 12px 14px; font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 16px; }
  .hint-box b { color: #ff6b3d; }

  /* ---------- 주간 리포트 ---------- */
  .report-hero { text-align: center; padding: 6px 0 18px; }
  .report-hero .r-amt { font-size: 34px; font-weight: 800; color: #1a1a1a; letter-spacing: -1px; }
  .report-hero .r-cap { font-size: 12px; color: #999; margin-top: 4px; }
  .report-delta { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; }
  .report-delta.up { background: #fff7f3; color: #ff6b3d; }
  .report-delta.down { background: #f1f4f8; color: #7c8aa0; }
  .report-rows { border-top: 1px solid #f1efe8; padding-top: 14px; }

  /* ---------- 배지 / 마일스톤 ---------- */
  .badge-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .badge { flex: 1; text-align: center; background: #f7f6f1; border-radius: 12px; padding: 12px 6px; opacity: .4; }
  .badge.earned { opacity: 1; background: #fff7f3; border: 1px solid #ffd9c7; }
  .badge .b-emoji { font-size: 20px; }
  .badge .b-label { font-size: 10px; color: #999; margin-top: 4px; font-weight: 700; }
  .badge.earned .b-label { color: #b0491f; }
  .celebrate { font-size: 46px; text-align: center; margin-bottom: 10px; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }

  /* ---------- 설정 토글 ---------- */
  .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #f1efe8; }
  .toggle-row .tg-label { font-size: 13px; font-weight: 700; }
  .toggle-row .tg-desc { font-size: 11px; color: #999; margin-top: 3px; line-height: 1.4; }
  .tg-btn { flex-shrink: 0; border: 1px solid #ece9df; background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 11px; font-weight: 700; color: #666; cursor: pointer; font-family: inherit; }
  .tg-btn.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  /* ---------- 앱(설치) 모드 / 모바일: 목업 프레임 제거하고 전체화면 ---------- */
  @media (display-mode: standalone), (display-mode: fullscreen), (max-width: 480px) {
    html, body { height: 100%; overscroll-behavior: none; }
    body { padding: 0; background: #f7f6f1; }
    .phone {
      max-width: none; width: 100%; height: 100dvh;
      border: none; border-radius: 0; box-shadow: none;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background: #f7f6f1;
    }
    .app { border-radius: 0; }
    .overlay, .receipt-screen { border-radius: 0; }
    .sheet { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="phone"><div class="app" id="app">

  <div class="topbar">
    <div class="toprow">
      <div class="brand" id="brandText">Donmaggi</div>
      <div class="langs">
        <div class="lang-btn" id="settingsBtn" onclick="openSettings()">⚙️</div>
        <div class="lang-btn active" id="lang-ko" onclick="setLanguage('ko')">🇰🇷</div>
        <div class="lang-btn" id="lang-en" onclick="setLanguage('en')">🇺🇸</div>
        <div class="lang-btn" id="lang-ja" onclick="setLanguage('ja')">🇯🇵</div>
        <div class="lang-btn" id="lang-zh" onclick="setLanguage('zh')">🇨🇳</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab" id="tab-food" onclick="switchTab('food')"></div>
      <div class="tab" id="tab-fashion" onclick="switchTab('fashion')"></div>
      <div class="tab" id="tab-beauty" onclick="switchTab('beauty')"></div>
    </div>
  </div>

  <div class="goal-chips" id="goalChips"></div>

  <div class="goal-card">
    <div class="goal-top">
      <span class="goal-name" id="goalNameText"></span>
      <span class="goal-pct" id="goalPct">70%</span>
    </div>
    <div class="goal-amt" id="goalAmt"></div>
    <div class="gauge">
      <div class="gauge-track"></div>
      <div class="gauge-fill" id="gaugeFill" style="width:70%"></div>
      <div class="gauge-plane" id="gaugePlane" style="left:70%">✈️</div>
    </div>
    <div class="gauge-steps">
      <span class="done" id="stepPaid"></span>
      <span class="done" id="stepPrep"></span>
      <span id="stepShip"></span>
      <span id="stepDone"></span>
    </div>
  </div>

  <!-- 취약 시간대 / 재참여 넛지 -->
  <div class="nudge" id="nudgeBar">
    <div class="n-emoji" id="nudgeEmoji">🌙</div>
    <div class="n-body" id="nudgeText"></div>
    <button class="n-cta" id="nudgeCta" onclick="nudgeAction()"></button>
    <div class="n-close" onclick="dismissNudge()">✕</div>
  </div>

  <div class="tool-row">
    <button class="tool-btn" id="btnQuickLog" onclick="openQuickLog()"></button>
    <button class="tool-btn" id="btnStreak" onclick="openStreak()"></button>
    <button class="tool-btn" id="btnInsights" onclick="openInsights()"></button>
  </div>

  <div class="section-title" id="sectionTitleText"></div>
  <div class="section-sub" id="sectionSubText"></div>
  <div class="zone" id="zone"></div>

  <!-- 카카오페이 링크 설정 -->
  <div class="overlay" id="ovSettings">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="settingsTitleText"></h3>
      <p class="sheet-desc" id="settingsDescText"></p>
      <div class="field">
        <label id="settingsInputLabelText"></label>
        <input type="url" id="myKakaoLinkInput" placeholder="https://link.kakaopay.com/...">
      </div>
      <div class="field">
        <label id="settingsBankLabelText"></label>
        <input type="text" id="myBankInput" maxlength="20">
      </div>
      <div class="field">
        <label id="settingsAccountLabelText"></label>
        <input type="text" id="myAccountInput" maxlength="30" inputmode="numeric">
      </div>
      <div class="field">
        <label>상품 목록 주소 (Catalog URL)</label>
        <input type="url" id="catalogUrlInput" placeholder="products.json 또는 https://...">
        <div style="font-size:11px;color:#bbb;margin-top:5px" id="catalogStatus"></div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="tg-label" id="notifyLabelText"></div>
          <div class="tg-desc" id="notifyDescText"></div>
        </div>
        <button class="tg-btn" id="notifyBtn" onclick="toggleNotify()"></button>
      </div>
      <button class="primary" id="settingsSaveBtn" onclick="saveSettings()"></button>
      <button class="ghost" id="settingsCancelBtn" onclick="closeOverlay('ovSettings')"></button>
      <button class="ghost" onclick="resetState()" style="height:36px;font-size:12px;color:#c0392b">↺ Reset</button>
    </div>
  </div>

  <!-- 새 목표 만들기 -->
  <div class="overlay" id="ovNewGoal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="newGoalTitleText"></h3>
      <p class="sheet-desc" id="chooseIconText"></p>
      <div class="emoji-grid" id="emojiGrid"></div>
      <div class="field">
        <label id="goalNameLabelText"></label>
        <input type="text" id="newGoalName" maxlength="20">
      </div>
      <div class="field">
        <label id="goalAmountLabelText"></label>
        <input type="number" id="newGoalAmount" min="1000" step="1000">
      </div>
      <div class="hint-box" id="goalSuggestBox" style="display:none;cursor:pointer" onclick="applyGoalSuggest()"></div>
      <button class="primary" id="goalSaveBtn" onclick="saveNewGoal()"></button>
      <button class="ghost" id="goalCancelBtn" onclick="closeOverlay('ovNewGoal')"></button>
    </div>
  </div>

  <div class="overlay" id="ovGroup">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="groupTitle"></h3>
      <div id="groupList"></div>
      <button class="ghost" id="groupCloseBtn" onclick="closeOverlay('ovGroup')"></button>
    </div>
  </div>

  <div class="overlay" id="ovConfirm">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3 class="sheet-title" id="cfTitle"></h3>

  // ---------- 상품 카탈로그: 원격에서 불러오기 ----------
  // CATALOG_URL을 서버/API 엔드포인트로 바꾸면 앱을 다시 배포하지 않아도 상품·가격이 갱신됩니다.
  // 설정(⚙️) 화면에서 URL을 직접 넣을 수도 있습니다. 비워두면 같은 폴더의 products.json을 씁니다.
  let CATS = FALLBACK_CATS;
  let CATALOG_URL = localStorage.getItem('donmaggi_catalog_url') || 'products.json';

  function isValidCatalog(j) {
    return j && j.ko && j.ko.food && Array.isArray(j.ko.food.smalls);
  }

  function applyCatalog(j, source) {
    CATS = j;
    // 현재 언어에 없는 카탈로그면 ko로 폴백
    if (!CATS[currentLang]) CATS[currentLang] = CATS.ko;
    renderZone(activeTab);
    const el = document.getElementById('catalogStatus');
    if (el) el.textContent = source;
  }

  async function refreshCatalog() {
    // 1순위: 직전에 성공한 캐시를 즉시 적용 (오프라인에서도 최신 상태 유지)
    try {
      const cached = localStorage.getItem('donmaggi_catalog_cache');
      if (cached) {
        const j = JSON.parse(cached);
        if (isValidCatalog(j)) applyCatalog(j, '저장된 목록');
      }
    } catch (e) {}

    // 2순위: 네트워크에서 최신본 가져오기
    try {
      const res = await fetch(CATALOG_URL + (CATALOG_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const j = await res.json();
      if (!isValidCatalog(j)) throw new Error('형식 오류');
      localStorage.setItem('donmaggi_catalog_cache', JSON.stringify(j));
      localStorage.setItem('donmaggi_catalog_at', new Date().toISOString());
      applyCatalog(j, '갱신됨 ' + new Date().toLocaleTimeString('ko-KR'));
    } catch (e) {
      const el = document.getElementById('catalogStatus');
      if (el) el.textContent = '갱신 실패 (저장된 목록 사용)';
    }
  }

  function renderGoalChips() {
    let html = '';
    goals.forEach(g => {
      const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
      const name = g.id === 'default' ? T[currentLang].goalName.replace(/^\S+\s/, '') : g.name;
      html += `<div class="chip ${g.id === activeGoalId ? 'active' : ''}" onclick="setActiveGoal('${g.id}')">${g.emoji} ${name} <span class="pct">${pct}%</span></div>`;
    });
    html += `<div class="chip-add" onclick="openNewGoal()">+</div>`;
    document.getElementById('goalChips').innerHTML = html;
  }

    activeGoalId = id;

    const g = activeGoal();
    const pct = Math.min(100, Math.round((g.saved / g.target) * 100));
    document.getElementById('goalNameText').textContent = goalDisplayName(g);
    document.getElementById('goalPct').textContent = pct + '%';
    document.getElementById('goalAmt').textContent = `${fmt(g.saved)}${t.currency} / ${fmt(g.target)}${t.currency} ${t.savedSuffix}`;
    document.getElementById('gaugeFill').style.width = pct + '%';

    document.getElementById('stepPaid').textContent = t.stepPaid;
    document.getElementById('stepPrep').textContent = t.stepPrep;
    document.getElementById('stepShip').textContent = t.stepShip;
    document.getElementById('stepDone').textContent = t.stepDone;

    logEvent({
      amount: current.price,
      goalId: g.id,
      name: current.name,
      category: current.category || activeTab,
      source: entrySource

    document.getElementById('rcName').textContent = current.name;

    document.getElementById('rcStatLabel').textContent = current.statLabel || '';

    document.getElementById('rcGoalPct').textContent = '+' + pct + '%';
    document.getElementById('ovReceipt').classList.add('open');
  }

  const EV_KEY = 'donmaggi_events';
  const MS_DAY = 86400000;
  const LOCALES = { ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN' };
  const QUICK_PRESETS = [5000, 10000, 20000, 30000, 50000];
  const MILESTONES = [100000, 300000, 500000, 1000000, 3000000, 5000000, 10000000];

  let entrySource = 'manual';   // manual | share | shortcut | nudge
  let events = loadEvents();

  // ---------- 이벤트 로그 (모든 지표의 전제) ----------
  function loadEvents() {
    try {
      const raw = localStorage.getItem(EV_KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) { return []; }
  }
  function saveEvents() {
    try { localStorage.setItem(EV_KEY, JSON.stringify(events.slice(-500))); } catch (e) {}
  }
  function logEvent(data) {
    events.push(Object.assign({ id: 'e' + Date.now(), ts: Date.now() }, data));
    saveEvents();
  }

  // ---------- 날짜 도우미 ----------
  function startOfDay(ts) { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
  function weekStart(ts) {                       // 월요일 기준 주 시작
    const d = startOfDay(ts);
    const dow = (new Date(d).getDay() + 6) % 7;  // 월=0
    return d - dow * MS_DAY;
  }
  function sumAmount(list) { return list.reduce((a, e) => a + (e.amount || 0), 0); }
  function eventsBetween(from, to) { return events.filter(e => e.ts >= from && e.ts < to); }
  function totalSavedAll() { return sumAmount(events); }

  // ---------- 개인화: 취약 시간대 ----------
  function vulnerableHours() {
    if (events.length < 5) return { hours: [21, 22, 23], personalised: false };
    const byHour = new Array(24).fill(0);
    events.forEach(e => byHour[new Date(e.ts).getHours()]++);
    const ranked = byHour.map((c, h) => ({ c, h }))
      .filter(x => x.c > 0)
      .sort((a, b) => b.c - a.c)
      .slice(0, 2)
      .map(x => x.h);
    return { hours: ranked, personalised: true };
  }
  function hourRangeLabel(hours) {
    return hours.slice().sort((a, b) => a - b).map(h => String(h).padStart(2, '0') + ':00').join(', ');
  }

  // ---------- 리텐션: 스트릭 ----------
  function activeDays() {
    return Array.from(new Set(events.map(e => startOfDay(e.ts)))).sort((a, b) => b - a);
  }
  function bestStreak(days) {
    if (!days.length) return 0;
    const asc = days.slice().sort((a, b) => a - b);
    let best = 1, run = 1;
    for (let i = 1; i < asc.length; i++) {
      run = (asc[i] - asc[i-1]) === MS_DAY ? run + 1 : 1;
      if (run > best) best = run;
    }
    return best;
  }
  function computeStreak() {
    const days = activeDays();
    if (!days.length) return { current: 0, best: 0, freezeUsed: false };
    const today = startOfDay(Date.now());
    // 오늘 아직 기록 전이어도 어제까지 이어졌으면 스트릭은 살아 있습니다.
    if (days[0] !== today && days[0] !== today - MS_DAY) {
      return { current: 0, best: bestStreak(days), freezeUsed: false };
    }
    let cursor = days[0], current = 1, freezeUsed = false;
    for (let i = 1; i < days.length; i++) {
      const gap = (cursor - days[i]) / MS_DAY;
      if (gap === 1) { current++; cursor = days[i]; }
      else if (gap === 2 && !freezeUsed) { current++; freezeUsed = true; cursor = days[i]; }  // 보호권 1회
      else break;
    }
    return { current, best: Math.max(current, bestStreak(days)), freezeUsed };
  }

  // ---------- 리텐션: 마일스톤 ----------
  function hitMilestones() {
    try { return JSON.parse(localStorage.getItem('donmaggi_milestones') || '[]'); } catch (e) { return []; }
  }
  function checkMilestone() {
    const total = totalSavedAll();
    const hit = hitMilestones();
    const fresh = MILESTONES.filter(m => total >= m && hit.indexOf(m) === -1);
    if (!fresh.length) return;
    try { localStorage.setItem('donmaggi_milestones', JSON.stringify(hit.concat(fresh))); } catch (e) {}
    showMilestone(fresh[fresh.length - 1]);
  }
  function showMilestone(amount) {
    const t = T[currentLang];
    document.getElementById('milestoneTitleText').textContent = t.milestoneTitle(priceLabel(amount));
    document.getElementById('milestoneDescText').textContent = t.milestoneDesc;
    document.getElementById('milestoneCloseBtn').textContent = t.milestoneClose;
    openOverlay('ovMilestone');
  }

  // ---------- 개입 지점 1: 빠른 기록 ----------
  function openQuickLog(amount, name) {
    const t = T[currentLang];
    document.getElementById('quickAmount').value = amount ? String(amount) : '';
    document.getElementById('quickName').value = name || '';
    document.getElementById('quickName').placeholder = t.quickNamePlaceholder;
    document.getElementById('quickUnitText').textContent = t.currency.trim();
    document.getElementById('quickChips').innerHTML =
      QUICK_PRESETS.map(v => `<button class="amt-chip" onclick="bumpQuick(${v})">+${fmt(v)}</button>`).join('');
    const note = { share: t.quickSrcShare, shortcut: t.quickSrcShortcut, nudge: t.quickSrcNudge }[entrySource] || '';
    document.getElementById('quickSrcNote').textContent = note;
    openOverlay('ovQuick');
    if (!amount) setTimeout(() => document.getElementById('quickAmount').focus(), 350);
  }
  function bumpQuick(v) {
    const el = document.getElementById('quickAmount');
    el.value = String((parseInt(el.value, 10) || 0) + v);
  }
  function closeQuickLog() { closeOverlay('ovQuick'); entrySource = 'manual'; }
  function saveQuickLog() {
    const amt = parseInt(document.getElementById('quickAmount').value, 10);
    if (!amt || amt <= 0) { document.getElementById('quickAmount').focus(); return; }
    const name = document.getElementById('quickName').value.trim() || T[currentLang].quickDefaultName;
    current = { name, price: amt, emoji: '⚡', statLabel: '', statValue: '', category: 'quick' };
    closeOverlay('ovQuick');
    showReceipt();
  }

  // ---------- 개입 지점 2: 공유시트 / 바로가기 유입 ----------
  function parseSharedAmount(text) {
    if (!text) return 0;
    const flat = String(text).replace(/\s+/g, '');
    // 통화 표기가 붙은 금액을 최우선으로 봅니다.
    const marked = flat.match(/(?:₩|krw)?(\d{1,3}(?:,\d{3})+|\d{3,9})(?:원|₩|krw|won|엔|元)/i);
    if (marked) {
      const n = parseInt(marked[1].replace(/,/g, ''), 10);
      if (n >= 100) return n;
    }
    const candidates = (flat.match(/\d{1,3}(?:,\d{3})+|\d{3,9}/g) || [])
      .map(s => parseInt(s.replace(/,/g, ''), 10))
      .filter(n => n >= 1000 && n <= 10000000);
    return candidates.length ? Math.max.apply(null, candidates) : 0;
  }
  function handleEntryParams() {
    let p;
    try { p = new URLSearchParams(location.search); } catch (e) { return; }
    const shared = [p.get('title'), p.get('text'), p.get('url')].filter(Boolean).join(' ');
    const quick = p.get('quick');
    const insights = p.get('insights');
    if (!shared && !quick && !insights) return;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (shared) {
      entrySource = 'share';
      openQuickLog(parseSharedAmount(shared), (p.get('title') || '').trim().slice(0, 30));
    } else if (quick) {
      entrySource = 'shortcut';
      openQuickLog();
    } else {
      openInsights();
    }
  }

  // ---------- 개입 지점 3: 넛지 배너 ----------
  function nudgeDismissedToday() { return localStorage.getItem('donmaggi_nudge_at') === dayKey(Date.now()); }
  function dismissNudge() {
    try { localStorage.setItem('donmaggi_nudge_at', dayKey(Date.now())); } catch (e) {}
    document.getElementById('nudgeBar').classList.remove('show');
  }
  function renderNudge() {
    const t = T[currentLang];
    const bar = document.getElementById('nudgeBar');
    bar.classList.remove('show');
    if (nudgeDismissedToday()) return;

    // 배열 순서에 의존하지 않도록 최신 시각을 직접 구합니다.
    const last = events.reduce((mx, e) => (e.ts > mx ? e.ts : mx), 0);
    if (last && (Date.now() - last) > 7 * MS_DAY) {          // 7일 이상 미접속 → 재소환
      document.getElementById('nudgeEmoji').textContent = '👋';
      document.getElementById('nudgeText').textContent = t.nudgeComeback(priceLabel(totalSavedAll()));
      document.getElementById('nudgeCta').textContent = t.nudgeCta;
      bar.classList.add('show');
      return;
    }
    const v = vulnerableHours();
    const h = new Date().getHours();
    if (v.hours.indexOf(h) !== -1) {                          // 취약 시간대
      document.getElementById('nudgeEmoji').textContent = '🌙';
      document.getElementById('nudgeText').textContent =
        v.personalised ? t.nudgePersonal(hourRangeLabel([h])) : t.nudgeGeneric;
      document.getElementById('nudgeCta').textContent = t.nudgeCta;
      bar.classList.add('show');
    }
  }
  function nudgeAction() { entrySource = 'nudge'; dismissNudge(); openQuickLog(); }

  // ---------- 알림 ----------
  // PWA 한계: 푸시 서버 없이는 앱이 살아 있는 동안에만 예약이 유효합니다.
  function notifySupported() { return typeof Notification !== 'undefined'; }
  function notifyEnabled() {
    return notifySupported() && localStorage.getItem('donmaggi_notify') === '1' && Notification.permission === 'granted';
  }
  function renderNotifyBtn() {
    const t = T[currentLang], btn = document.getElementById('notifyBtn');
    if (!btn) return;
    document.getElementById('notifyLabelText').textContent = t.notifyLabel;
    document.getElementById('notifyDescText').textContent = t.notifyDesc;
    if (!notifySupported()) { btn.textContent = t.notifyUnsupported; btn.classList.remove('on'); return; }
    if (Notification.permission === 'denied') { btn.textContent = t.notifyBlocked; btn.classList.remove('on'); return; }
    const on = notifyEnabled();
    btn.textContent = on ? t.notifyOn : t.notifyOff;
    btn.classList.toggle('on', on);
  }
  function toggleNotify() {
    if (!notifySupported()) return;
    if (notifyEnabled()) {
      try { localStorage.setItem('donmaggi_notify', '0'); } catch (e) {}
      if (nudgeTimer) clearTimeout(nudgeTimer);
      renderNotifyBtn();
      return;
    }
    const done = (perm) => {
      if (perm === 'granted') {
        try { localStorage.setItem('donmaggi_notify', '1'); } catch (e) {}
        scheduleNudgeNotification();
      }
      renderNotifyBtn();
    };
    if (Notification.permission === 'default') {
      const r = Notification.requestPermission(done);
      if (r && typeof r.then === 'function') r.then(done).catch(() => {});
    } else { done(Notification.permission); }
  }
  function scheduleNudgeNotification() {
    if (nudgeTimer) clearTimeout(nudgeTimer);
    if (!notifyEnabled()) return;
    const now = Date.now();
    let soonest = Infinity;
    vulnerableHours().hours.forEach(h => {
      const target = new Date(); target.setHours(h, 0, 0, 0);
      let diff = target.getTime() - now;
      if (diff < 60000) diff += MS_DAY;
      if (diff < soonest) soonest = diff;
    });
    if (!isFinite(soonest)) return;
    nudgeTimer = setTimeout(() => {
      try {
        const t = T[currentLang];
        new Notification(t.brand, { body: t.nudgeGeneric, icon: 'icons/icon-192.png', tag: 'donmaggi-nudge' });
      } catch (e) {}
      scheduleNudgeNotification();
    }, Math.min(soonest, 2147483000));
  }

  // ---------- 개인화: 패턴 대시보드 ----------
  function barRows(pairs, max) {
    return pairs.map(p => {
      const w = max ? Math.round((p.v / max) * 100) : 0;
      return `<div class="bar-row">
        <div class="bar-label">${p.k}</div>
        <div class="bar-track"><div class="bar-fill ${p.v ? '' : 'dim'}" style="width:${w}%"></div></div>
        <div class="bar-val">${p.v || ''}</div>
      </div>`;
    }).join('');
  }
  function openInsights() {
    const t = T[currentLang];
    document.getElementById('insightsTitleText').textContent = t.insightsTitle;
    document.getElementById('insightsCloseBtn').textContent = t.insightsClose;
    const body = document.getElementById('insightsBody');

    if (!events.length) {
      body.innerHTML = `<div class="empty-note">${t.insightsEmpty}</div>`;
      openOverlay('ovInsights');
      return;
    }

    const total = totalSavedAll(), count = events.length, avg = Math.round(total / count);
    const unit = t.currency.trim();

    const buckets = new Array(6).fill(0);
    events.forEach(e => buckets[Math.floor(new Date(e.ts).getHours() / 4)]++);
    const bucketPairs = buckets.map((v, i) => ({
      k: String(i * 4).padStart(2, '0') + '–' + String(i * 4 + 4).padStart(2, '0'), v
    }));

    const dow = new Array(7).fill(0);
    events.forEach(e => dow[(new Date(e.ts).getDay() + 6) % 7]++);
    const fmtDay = new Intl.DateTimeFormat(LOCALES[currentLang] || 'en-US', { weekday: 'short' });
    const dowPairs = dow.map((v, i) => ({ k: fmtDay.format(new Date(2024, 0, 1 + i)), v }));  // 2024-01-01 = 월

    const catMap = { food: t.tabFood, fashion: t.tabFashion, beauty: t.tabBeauty, quick: t.btnQuick };
    const catCount = {};
    events.forEach(e => { const k = e.category || 'quick'; catCount[k] = (catCount[k] || 0) + 1; });
    const catPairs = Object.keys(catCount).map(k => ({ k: (catMap[k] || k).replace(/^\S+\s/, ''), v: catCount[k] }));

    const srcMap = { manual: t.srcManual, share: t.srcShare, shortcut: t.srcShortcut, nudge: t.srcNudge };
    const srcCount = {};
    events.forEach(e => { const k = e.source || 'manual'; srcCount[k] = (srcCount[k] || 0) + 1; });
    const srcPairs = Object.keys(srcCount).map(k => ({ k: srcMap[k] || k, v: srcCount[k] }));

    const v = vulnerableHours();
    const hint = v.personalised ? t.insightsHintPersonal(hourRangeLabel(v.hours)) : t.insightsHintGeneric;
    const maxOf = arr => Math.max.apply(null, arr.concat([0]));

    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="s-val">${fmt(total)}</div><div class="s-key">${t.insightsTotal} (${unit})</div></div>
        <div class="stat-box"><div class="s-val">${count}</div><div class="s-key">${t.insightsCount}</div></div>
        <div class="stat-box"><div class="s-val">${fmt(avg)}</div><div class="s-key">${t.insightsAvg} (${unit})</div></div>
      </div>
      <div class="hint-box">${hint}</div>
      <div class="chart"><p class="chart-title">${t.insightsByHour}</p>${barRows(bucketPairs, maxOf(buckets))}</div>
      <div class="chart"><p class="chart-title">${t.insightsByDay}</p>${barRows(dowPairs, maxOf(dow))}</div>
      <div class="chart"><p class="chart-title">${t.insightsByCat}</p>${barRows(catPairs, maxOf(catPairs.map(x => x.v)))}</div>
      <div class="chart"><p class="chart-title">${t.insightsBySrc}</p>${barRows(srcPairs, maxOf(srcPairs.map(x => x.v)))}</div>`;
    openOverlay('ovInsights');
  }

  // ---------- 개인화: 목표 금액 추천 ----------
  function suggestGoalAmount() {
    const recent = events.filter(e => e.ts >= Date.now() - 28 * MS_DAY);
    if (recent.length < 3) return 0;
    const perWeek = sumAmount(recent) / 4;
    const projected = Math.round(perWeek * 13 / 10000) * 10000;   // 3개월(13주), 만 단위 반올림
    return projected >= 10000 ? projected : 0;
  }
  function renderGoalSuggest() {
    const box = document.getElementById('goalSuggestBox');
    suggestedGoalAmount = suggestGoalAmount();
    if (!suggestedGoalAmount) { box.style.display = 'none'; return; }
    box.innerHTML = T[currentLang].goalSuggest(priceLabel(suggestedGoalAmount));
    box.style.display = 'block';
  }
  function applyGoalSuggest() {
    if (!suggestedGoalAmount) return;
    document.getElementById('newGoalAmount').value = String(suggestedGoalAmount);
  }

  // ---------- 리텐션: 주간 리포트 ----------
  function openReport(auto) {
    const t = T[currentLang];
    const thisWeek = weekStart(Date.now());
    const lastWeek = thisWeek - 7 * MS_DAY;
    const lastList = eventsBetween(lastWeek, thisWeek);
    const prevList = eventsBetween(lastWeek - 7 * MS_DAY, lastWeek);
    if (auto && !lastList.length) return false;

    document.getElementById('reportTitleText').textContent = t.reportTitle;
    document.getElementById('reportCloseBtn').textContent = t.reportClose;

    const lastSum = sumAmount(lastList), prevSum = sumAmount(prevList);
    let delta = '';
    if (prevSum > 0) {
      const pct = Math.round(Math.abs(lastSum - prevSum) / prevSum * 100);
      if (pct < 5) delta = `<div class="report-delta down">${t.reportFlat}</div>`;
      else delta = lastSum > prevSum
        ? `<div class="report-delta up">${t.reportUp(pct)}</div>`
        : `<div class="report-delta down">${t.reportDown(pct)}</div>`;
    }
    document.getElementById('reportBody').innerHTML = lastList.length ? `
      <div class="report-hero">
        <div class="r-amt">${priceLabel(lastSum)}</div>
        <div class="r-cap">${t.reportCap}</div>
        ${delta}
      </div>
      <div class="report-rows">
        <div class="r-row"><span class="k">${t.reportCount}</span><span class="v">${lastList.length}</span></div>
        <div class="r-row"><span class="k">${t.reportPrev}</span><span class="v">${priceLabel(prevSum)}</span></div>
      </div>` : `<div class="empty-note">${t.reportEmpty}</div>`;
    openOverlay('ovReport');
    return true;
  }
  function maybeShowWeeklyReport() {
    const wk = String(weekStart(Date.now()));
    if (localStorage.getItem('donmaggi_report_week') === wk) return;
    if (openReport(true)) {
      try { localStorage.setItem('donmaggi_report_week', wk); } catch (e) {}
    }
  }

  // ---------- 리텐션: 스트릭 패널 ----------
  function openStreak() {
    const t = T[currentLang];
    const s = computeStreak();
    document.getElementById('streakTitleText').textContent = t.streakTitle;
    document.getElementById('streakCloseBtn').textContent = t.streakClose;
    const badges = [
      { n: 7,   label: t.badge7,   emoji: '🔥' },
      { n: 30,  label: t.badge30,  emoji: '🏅' },
      { n: 100, label: t.badge100, emoji: '👑' }
    ].map(b => `<div class="badge ${s.best >= b.n ? 'earned' : ''}">
        <div class="b-emoji">${b.emoji}</div><div class="b-label">${b.label}</div></div>`).join('');
    document.getElementById('streakBody').innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="s-val">${s.current}</div><div class="s-key">${t.streakNow} (${t.btnStreakUnit})</div></div>
        <div class="stat-box"><div class="s-val">${s.best}</div><div class="s-key">${t.streakBest} (${t.btnStreakUnit})</div></div>
        <div class="stat-box"><div class="s-val">${s.freezeUsed ? t.streakFreezeUsed : t.streakFreezeLeft}</div><div class="s-key">${t.streakFreeze}</div></div>
      </div>
      <div class="badge-row">${badges}</div>
      <div class="hint-box" style="margin-top:16px">${t.streakHint}</div>`;
    openOverlay('ovStreak');
  }

  // ---------- 상단 도구 줄 ----------
  function renderToolRow() {
    const t = T[currentLang];
    const s = computeStreak();
    document.getElementById('btnQuickLog').textContent = t.btnQuick;
    const sb = document.getElementById('btnStreak');
    sb.innerHTML = `<span>🔥 <span class="t-num">${s.current}</span>${t.btnStreakUnit}</span>`;
    sb.classList.toggle('hot', s.current > 0);
    document.getElementById('btnInsights').textContent = t.btnInsights;
  }

  setLanguage(currentLang);
  switchTab('food');
  refreshCatalog();
  handleEntryParams();
  maybeShowWeeklyReport();
  scheduleNudgeNotification();
  // 앱을 다시 열 때마다 최신 목록 확인
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCatalog(); });

  // ---------- 서비스 워커 등록 (오프라인 실행) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
